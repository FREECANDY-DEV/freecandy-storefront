<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="FREECANDY — GitHub operator. Real repos, bots, pages, crypto." />
  <meta name="theme-color" content="#07080c" />
  <title>FREECANDY</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="fx" aria-hidden="true"></div>
  <div class="screen" id="screen">
    <header class="top">
      <a class="brand" href="https://github.com/FREECANDY-DEV" target="_blank" rel="noreferrer">
        <span class="dot"></span>
        <strong>FREECANDY</strong>
        <span class="sep">/</span>
        <span>FREECANDY-DEV</span>
      </a>
      <div class="tools">
        <span id="clock">00:00:00</span>
        <button type="button" class="wallet-btn" id="wallet-btn" aria-expanded="false" aria-controls="wallet-panel" title="Deposit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h13A2.5 2.5 0 0 1 21 7.5V9h-6.2a2.2 2.2 0 1 0 0 4.4H21v2.1A2.5 2.5 0 0 1 18.5 18h-13A2.5 2.5 0 0 1 3 15.5v-8Z" fill="currentColor"/><circle cx="15.2" cy="11.2" r="1" fill="#07110b"/></svg>
        </button>
      </div>
    </header>

    <section class="panel identity">
      <p class="kicker">github operator</p>
      <h1>Bots, pages, and tools. Built in public.</h1>
      <p class="line">Fixed price · 48–96h · no calls</p>
      <ul class="offers">
        <li><b>Bots</b><span>from $99</span></li>
        <li><b>Pages</b><span>from $79</span></li>
        <li><b>Flows</b><span>from $149</span></li>
      </ul>
    </section>

    <section class="panel repos" aria-label="Repositories">
      <p class="kicker">repos</p>
      <div class="grid">
        <a href="https://github.com/FREECANDY-DEV/pixel-world" target="_blank" rel="noreferrer">
          <img src="assets/repo-pixel-world.gif" alt="pixel-world seasons forest" />
          <span>pixel-world</span>
        </a>
        <a href="https://github.com/FREECANDY-DEV/Deus" target="_blank" rel="noreferrer">
          <img src="assets/repo-deus.jpg" alt="DEUS neural persona" />
          <span>Deus</span>
        </a>
        <a href="https://github.com/FREECANDY-DEV/Pro_Linux_Screen_control" target="_blank" rel="noreferrer">
          <img src="assets/repo-screen.jpg" alt="screen control preview" />
          <span>screen control</span>
        </a>
        <a href="https://github.com/FREECANDY-DEV/TryHackMe-writeups" target="_blank" rel="noreferrer">
          <img src="assets/repo-thm.png" alt="TryHackMe writeups" />
          <span>writeups</span>
        </a>
      </div>
    </section>

    <form class="panel order" id="order-form">
      <p class="kicker">order</p>
      <label>Handle<input id="handle" required maxlength="64" placeholder="@you" /></label>
      <label>Contact<input id="contact" required maxlength="120" placeholder="telegram or email" /></label>
      <label>Job
        <select id="package" required>
          <option value="">Select</option>
          <option>WhatsApp/Telegram bot from $99</option>
          <option>Landing page from $79</option>
          <option>Automation / n8n from $149</option>
        </select>
      </label>
      <label>Brief<input id="brief" required maxlength="400" placeholder="what to build" /></label>
      <button class="go" type="submit">Send brief</button>
      <p class="note" id="order-note" hidden></p>
    </form>
  </div>

  <div class="wallet-panel" id="wallet-panel" hidden>
    <p>Choose a deposit</p>
    <button type="button" data-copy="TSTtvBTt8qrDE5fFoAp3DzqW58H8dfYwhV">USDT TRC20</button>
    <button type="button" data-copy="rBuZfn1m4tA6znziHsRp9AyC1M3qg6rgbF">XRP address</button>
    <button type="button" class="memo" data-copy="6421912">XRP memo 6421912</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
