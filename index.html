<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>FREECANDY</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #000; color: #f4efe6; font-family: Georgia, serif; }
    #stars {
      position: fixed; inset: 0; width: 100%; height: 100%;
      z-index: 0; display: block; pointer-events: none;
    }
    .stage { position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; }
    .mark {
      position: absolute; top: 14px; left: 16px; z-index: 6;
      color: #f4efe6; text-decoration: none; letter-spacing: .2em; font-size: 15px;
    }
    .reaper-wrap {
      position: absolute; left: 50%; top: 46%;
      width: min(168px, 40vw); height: min(250px, 42vh);
      transform: translate(-50%, -50%);
      overflow: hidden; z-index: 2; pointer-events: none;
    }
    .reaper {
      height: 112%; width: auto; max-width: none;
      position: absolute; left: 42%; top: 0; transform: translateX(-50%);
    }
    .ghost {
      position: absolute; z-index: 4;
      width: 64px; height: 64px; padding: 0; border: 0;
      background-color: transparent;
      background-image: url("assets/ghosts.jpg?v=6");
      background-repeat: no-repeat; background-size: 200% 200%;
      cursor: pointer;
    }
    .g-svc { left: 8%; top: 16%; background-position: 0 0; }
    .g-arc { right: 8%; top: 18%; background-position: 100% 0; }
    .g-talk { left: 10%; bottom: 10%; background-position: 0 100%; }
    .g-pay { right: 8%; bottom: 10%; background-position: 100% 100%; }
    .menu {
      position: absolute; z-index: 8;
      width: min(280px, calc(100vw - 24px));
      max-height: 46vh; overflow: auto;
      background: rgba(0,0,0,.9); border: 1px solid rgba(244,239,230,.22);
      padding: 14px;
    }
    .menu h2 { margin: 0 0 8px; font-weight: 500; font-size: 26px; }
    .menu p, .menu li { color: #b7b1a6; }
    .menu ul { margin: 8px 0 0; padding: 0; list-style: none; }
    .menu a, .menu button {
      color: #f4efe6; text-decoration: none; display: block; width: 100%;
      text-align: left; background: transparent; border: 0;
      border-top: 1px solid rgba(244,239,230,.16);
      padding: 10px 0; font: inherit; cursor: pointer;
    }
    .menu small { display: block; color: #b7b1a6; font-size: 14px; }
    #svc { left: 12px; top: 26%; }
    #arc { right: 12px; top: 28%; }
    #talk { left: 12px; bottom: 22%; }
    #pay { right: 12px; bottom: 22%; }
    @media (max-width: 700px) {
      .reaper-wrap { width: min(150px, 38vw); height: min(220px, 36vh); top: 44%; }
      .ghost { width: 58px; height: 58px; }
      .g-svc { left: 4%; top: 12%; }
      .g-arc { right: 4%; top: 14%; }
      .g-talk { left: 6%; bottom: 8%; }
      .g-pay { right: 4%; bottom: 8%; }
      .menu { left: 12px !important; right: 12px !important; width: auto; top: auto; bottom: 16px; }
    }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>
  <div class="stage">
    <a class="mark" href="https://github.com/FREECANDY-DEV">FREECANDY</a>
    <div class="reaper-wrap"><img class="reaper" src="assets/reaper.jpg?v=6" alt="Pixel reaper" /></div>
    <button class="ghost g-svc" type="button" data-panel="svc" aria-label="Services"></button>
    <button class="ghost g-arc" type="button" data-panel="arc" aria-label="Archive"></button>
    <button class="ghost g-talk" type="button" data-panel="talk" aria-label="Contact"></button>
    <button class="ghost g-pay" type="button" data-panel="pay" aria-label="Deposit"></button>
    <section class="menu" id="svc" hidden>
      <h2>Services</h2>
      <ul>
        <li>Bots<small>from $99</small></li>
        <li>Pages<small>from $79</small></li>
        <li>Flows<small>from $149</small></li>
      </ul>
    </section>
    <section class="menu" id="arc" hidden>
      <h2>Archive</h2>
      <a href="https://github.com/FREECANDY-DEV/pixel-world">pixel-world</a>
      <a href="https://github.com/FREECANDY-DEV/Deus">Deus</a>
      <a href="https://github.com/FREECANDY-DEV/Pro_Linux_Screen_control">Screen control</a>
      <a href="https://github.com/FREECANDY-DEV/TryHackMe-writeups">Writeups</a>
    </section>
    <section class="menu" id="talk" hidden>
      <h2>Contact</h2>
      <p>Message on Telegram.</p>
      <a href="https://t.me/WIND0WSUPDATE">@WIND0WSUPDATE</a>
    </section>
    <section class="menu" id="pay" hidden>
      <h2>Deposit</h2>
      <p>Tap to copy. XRP needs the memo.</p>
      <button type="button" data-copy="TSTtvBTt8qrDE5fFoAp3DzqW58H8dfYwhV" data-label="USDT TRC20">USDT TRC20</button>
      <button type="button" data-copy="rBuZfn1m4tA6znziHsRp9AyC1M3qg6rgbF" data-label="XRP address">XRP address</button>
      <button type="button" data-copy="6421912" data-label="XRP memo 6421912">XRP memo 6421912</button>
    </section>
  </div>
  <script>
    const canvas = document.getElementById("stars");
    const ctx = canvas.getContext("2d");
    let stars = [];
    function makeStars() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvas.width = w;
      canvas.height = h;
      const n = Math.max(140, Math.min(280, Math.floor(w * h / 6000)));
      stars = Array.from({length: n}, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.15 + 0.35,
        a: Math.random() * 0.55 + 0.35,
        s: Math.random() * 0.28 + 0.06,
        p: Math.random() * Math.PI * 2
      }));
    }
    function draw(t) {
      const w = canvas.width;
      const h = canvas.height;
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, w, h);
      for (const star of stars) {
        star.y -= star.s;
        if (star.y < -2) star.y = h + 2;
        const tw = 0.55 + Math.sin(t * 0.002 + star.p) * 0.45;
        ctx.fillStyle = "rgba(255,246,230," + (star.a * tw) + ")";
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    makeStars();
    window.addEventListener("resize", makeStars);
    requestAnimationFrame(draw);
    const panels = [...document.querySelectorAll(".menu")];
    function closeAll() { panels.forEach((p) => { p.hidden = true; }); }
    document.querySelectorAll(".ghost").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const panel = document.getElementById(btn.dataset.panel);
        const willOpen = panel.hidden;
        closeAll();
        panel.hidden = !willOpen;
      });
    });
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".menu")) closeAll();
    });
    document.querySelectorAll("[data-copy]").forEach((btn) => {
      btn.addEventListener("click", async (e) => {
        e.stopPropagation();
        const label = btn.dataset.label;
        try { await navigator.clipboard.writeText(btn.dataset.copy); btn.textContent = "Copied"; }
        catch (err) { btn.textContent = btn.dataset.copy; }
        setTimeout(() => { btn.textContent = label; }, 900);
      });
    });
  </script>
</body>
</html>
