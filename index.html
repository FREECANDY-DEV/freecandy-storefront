<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>FREECANDY</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #000; color: #f3eee6; font-family: Georgia, serif; overflow: hidden; }
    #stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
    .stage { position: relative; z-index: 1; height: 100%; height: 100dvh; }
    .mark {
      position: absolute; top: max(12px, env(safe-area-inset-top)); left: 16px; z-index: 8;
      color: #f3eee6; text-decoration: none; letter-spacing: .22em; font-size: 14px;
    }
    .carousel {
      position: absolute; left: 50%; top: 10%;
      width: min(360px, 94vw); height: 150px;
      transform: translateX(-50%);
      z-index: 6; touch-action: pan-y;
    }
    .ghost {
      position: absolute; left: 50%; top: 50%;
      width: 84px; height: 84px;
      margin: -42px 0 0 -42px;
      border: 0; padding: 0; background: transparent;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      will-change: transform, opacity;
    }
    .ghost img {
      width: 84px; height: 84px;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      display: block;
      image-rendering: pixelated;
      pointer-events: none;
      filter: drop-shadow(0 12px 14px rgba(0,0,0,.6));
    }
    .hint {
      position: absolute; left: 50%; top: calc(10% + 152px);
      transform: translateX(-50%);
      margin: 0; color: rgba(243,238,230,.5);
      font-size: 11px; letter-spacing: .16em; text-transform: uppercase; z-index: 5;
    }
    .reaper-hit {
      position: absolute; left: 50%; top: 62%; z-index: 3;
      width: min(230px, 58vw); height: min(300px, 46vh);
      transform: translate(-50%, -50%);
      background: none; border: 0; padding: 0; cursor: pointer;
    }
    .reaper { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
    .slash-fx {
      position: fixed; inset: 0; z-index: 20; pointer-events: none;
      opacity: 0;
    }
    .slash-fx.on { animation: screenSlash .42s ease-out; }
    .slash-fx::before, .slash-fx::after {
      content: ""; position: absolute; left: -10%; top: 48%;
      width: 120%; height: 3px;
      background: linear-gradient(90deg, transparent, #fff6e4 18%, #fff 50%, #fff6e4 82%, transparent);
      box-shadow: 0 0 12px 2px rgba(255,246,228,.85), 0 0 28px 6px rgba(255,246,228,.35);
      transform-origin: center;
    }
    .slash-fx::before { transform: rotate(-28deg) scaleX(.1); }
    .slash-fx::after {
      top: 50%; height: 1px; opacity: .7;
      transform: rotate(-28deg) translateY(10px) scaleX(.1);
    }
    @keyframes screenSlash {
      0% { opacity: 0; }
      12% { opacity: 1; }
      100% { opacity: 0; }
    }
    .slash-fx.on::before { animation: blade .42s ease-out; }
    .slash-fx.on::after { animation: bladeSoft .42s ease-out; }
    @keyframes blade {
      0% { transform: rotate(-28deg) scaleX(.08); }
      35% { transform: rotate(-28deg) scaleX(1); }
      100% { transform: rotate(-28deg) scaleX(1.05); }
    }
    @keyframes bladeSoft {
      0% { transform: rotate(-28deg) translateY(10px) scaleX(.08); }
      35% { transform: rotate(-28deg) translateY(10px) scaleX(1); }
      100% { transform: rotate(-28deg) translateY(10px) scaleX(1.05); }
    }
    .menu {
      position: absolute; z-index: 9; left: 12px; right: 12px; bottom: 14px;
      max-height: 36vh; overflow: auto;
      background: rgba(0,0,0,.92); border: 1px solid rgba(243,238,230,.2); padding: 14px;
    }
    .menu h2 { margin: 0 0 8px; font-weight: 500; font-size: 26px; }
    .menu p, .menu li { color: #b7b1a6; }
    .menu ul { margin: 8px 0 0; padding: 0; list-style: none; }
    .menu a, .menu button {
      color: #f3eee6; text-decoration: none; display: block; width: 100%;
      text-align: left; background: transparent; border: 0;
      border-top: 1px solid rgba(243,238,230,.16);
      padding: 10px 0; font: inherit; cursor: pointer;
    }
    .menu small { display: block; color: #b7b1a6; font-size: 14px; }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>
  <div class="slash-fx" id="slash-fx"></div>
  <div class="stage">
    <a class="mark" href="https://github.com/FREECANDY-DEV">FREECANDY</a>
    <div class="carousel" id="carousel">
      <button class="ghost" type="button" data-panel="svc" data-i="0" aria-label="Services"><img src="assets/ghost-svc.jpg?v=31" width="84" height="84" alt="" /></button>
      <button class="ghost" type="button" data-panel="arc" data-i="1" aria-label="Archive"><img src="assets/ghost-arc.jpg?v=31" width="84" height="84" alt="" /></button>
      <button class="ghost" type="button" data-panel="talk" data-i="2" aria-label="Contact"><img src="assets/ghost-talk.jpg?v=31" width="84" height="84" alt="" /></button>
      <button class="ghost" type="button" data-panel="pay" data-i="3" aria-label="Deposit"><img src="assets/ghost-pay.jpg?v=31" width="84" height="84" alt="" /></button>
    </div>
    <p class="hint">swipe the circle</p>
    <button class="reaper-hit" id="reaper-hit" type="button" aria-label="Reaper">
      <img class="reaper" src="assets/reaper.jpg?v=31" alt="" />
    </button>
    <section class="menu" id="svc" hidden>
      <h2>Services</h2>
      <ul>
        <li>Bots<small>from $99</small></li>
        <li>Pages<small>from $79</small></li>
        <li>Flows<small>from $149</small></li>
      </ul>
    </section>
    <section class="menu" id="arc" hidden>
      <h2>Archive</h2>
      <a href="https://github.com/FREECANDY-DEV/pixel-world">pixel-world</a>
      <a href="https://github.com/FREECANDY-DEV/Deus">Deus</a>
      <a href="https://github.com/FREECANDY-DEV/Pro_Linux_Screen_control">Screen control</a>
      <a href="https://github.com/FREECANDY-DEV/TryHackMe-writeups">Writeups</a>
    </section>
    <section class="menu" id="talk" hidden>
      <h2>Contact</h2>
      <p>Message on Telegram.</p>
      <a href="https://t.me/WIND0WSUPDATE">@WIND0WSUPDATE</a>
    </section>
    <section class="menu" id="pay" hidden>
      <h2>Deposit</h2>
      <p>Tap to copy. XRP needs the memo.</p>
      <button type="button" data-copy="TSTtvBTt8qrDE5fFoAp3DzqW58H8dfYwhV" data-label="USDT TRC20">USDT TRC20</button>
      <button type="button" data-copy="rBuZfn1m4tA6znziHsRp9AyC1M3qg6rgbF" data-label="XRP address">XRP address</button>
      <button type="button" data-copy="6421912" data-label="XRP memo 6421912">XRP memo 6421912</button>
    </section>
  </div>
  <script>
    const canvas = document.getElementById("stars");
    const ctx = canvas.getContext("2d");
    function drawStars() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvas.width = w;
      canvas.height = h;
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, w, h);
      const n = Math.max(220, Math.min(420, Math.floor(w * h / 3200)));
      for (let i = 0; i < n; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        const bright = Math.random() < 0.08;
        const r = bright ? Math.random() * 1.15 + 0.9 : Math.random() * 0.7 + 0.25;
        const a = bright ? Math.random() * 0.35 + 0.6 : Math.random() * 0.4 + 0.18;
        const cool = Math.random() < 0.22;
        ctx.fillStyle = cool ? "rgba(214,224,255," + a + ")" : "rgba(255,248,236," + a + ")";
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        if (bright && Math.random() < 0.45) {
          ctx.strokeStyle = "rgba(255,248,236," + (a * 0.45) + ")";
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          ctx.moveTo(x - r * 3.4, y);
          ctx.lineTo(x + r * 3.4, y);
          ctx.moveTo(x, y - r * 3.4);
          ctx.lineTo(x, y + r * 3.4);
          ctx.stroke();
        }
      }
    }
    drawStars();
    window.addEventListener("resize", drawStars);

    const ghosts = [...document.querySelectorAll(".ghost")];
    const count = ghosts.length;
    let angle = 0;
    function layout() {
      const rx = Math.min(window.innerWidth * 0.38, 140);
      const ry = 48;
      ghosts.forEach((g, i) => {
        const a = (i / count) * Math.PI * 2 + angle;
        const x = Math.sin(a) * rx;
        const y = Math.cos(a) * ry;
        const depth = (Math.cos(a) + 1) / 2;
        const scale = 0.55 + depth * 0.9;
        const opacity = 0.3 + depth * 0.7;
        g.style.transform = "translate(" + x + "px," + y + "px) scale(" + scale + ")";
        g.style.opacity = String(opacity);
        g.style.zIndex = String(Math.round(20 + depth * 50));
      });
    }
    layout();
    window.addEventListener("resize", layout);

    function snap() {
      const step = (Math.PI * 2) / count;
      angle = Math.round(angle / step) * step;
      layout();
    }

    const carousel = document.getElementById("carousel");
    let dragging = false, startX = 0, startAngle = 0, moved = 0;
    carousel.addEventListener("pointerdown", (e) => {
      dragging = true; moved = 0; startX = e.clientX; startAngle = angle;
      carousel.setPointerCapture(e.pointerId);
    });
    carousel.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const dx = e.clientX - startX;
      moved = Math.max(moved, Math.abs(dx));
      angle = startAngle + dx / 70;
      layout();
    });
    function endDrag() {
      if (!dragging) return;
      dragging = false;
      snap();
    }
    carousel.addEventListener("pointerup", endDrag);
    carousel.addEventListener("pointercancel", endDrag);

    const panels = [...document.querySelectorAll(".menu")];
    function closeAll() { panels.forEach((p) => { p.hidden = true; }); }
    ghosts.forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (moved > 10) return;
        const i = Number(btn.dataset.i);
        const step = (Math.PI * 2) / count;
        angle = -i * step;
        layout();
        const panel = document.getElementById(btn.dataset.panel);
        const willOpen = panel.hidden;
        closeAll();
        panel.hidden = !willOpen;
      });
    });
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".menu") && !e.target.closest(".ghost")) closeAll();
    });

    const hit = document.getElementById("reaper-hit");
    const slashFx = document.getElementById("slash-fx");
    let slashTimer = 0;
    hit.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      slashFx.classList.remove("on");
      void slashFx.offsetWidth;
      slashFx.classList.add("on");
      clearTimeout(slashTimer);
      slashTimer = setTimeout(() => slashFx.classList.remove("on"), 450);
    });

    document.querySelectorAll("[data-copy]").forEach((btn) => {
      btn.addEventListener("click", async (e) => {
        e.stopPropagation();
        const label = btn.dataset.label;
        try { await navigator.clipboard.writeText(btn.dataset.copy); btn.textContent = "Copied"; }
        catch (err) { btn.textContent = btn.dataset.copy; }
        setTimeout(() => { btn.textContent = label; }, 900);
      });
    });
  </script>
</body>
</html>
