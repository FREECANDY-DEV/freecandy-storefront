<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>FREECANDY</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #000; color: #f3eee6; font-family: Georgia, serif; overflow: hidden; }
    #stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
    .stage { position: relative; z-index: 1; height: 100%; height: 100dvh; }
    .mark {
      position: absolute; top: max(12px, env(safe-area-inset-top)); left: 16px; z-index: 6;
      color: #f3eee6; text-decoration: none; letter-spacing: .22em; font-size: 14px;
    }
    .reaper {
      position: absolute; left: 50%; top: 48%;
      width: min(240px, 62vw); height: min(320px, 48vh);
      transform: translate(-50%, -50%);
      object-fit: contain; object-position: center;
      pointer-events: none; z-index: 2;
    }
    .ghost {
      position: absolute; z-index: 4;
      width: 56px; height: 56px; padding: 0; border: 0;
      background-color: transparent;
      background-image: url("assets/ghosts.jpg?v=7");
      background-repeat: no-repeat; background-size: 200% 200%;
      cursor: pointer;
    }
    .g-svc { left: max(8px, env(safe-area-inset-left)); top: 14%; background-position: 0 0; }
    .g-arc { right: max(8px, env(safe-area-inset-right)); top: 16%; background-position: 100% 0; }
    .g-talk { left: max(10px, env(safe-area-inset-left)); bottom: 8%; background-position: 0 100%; }
    .g-pay { right: max(8px, env(safe-area-inset-right)); bottom: 8%; background-position: 100% 100%; }
    .menu {
      position: absolute; z-index: 8;
      left: 12px; right: 12px; bottom: 14px;
      max-height: 42vh; overflow: auto;
      background: rgba(0,0,0,.92); border: 1px solid rgba(243,238,230,.2); padding: 14px;
    }
    .menu h2 { margin: 0 0 8px; font-weight: 500; font-size: 26px; }
    .menu p, .menu li { color: #b7b1a6; }
    .menu ul { margin: 8px 0 0; padding: 0; list-style: none; }
    .menu a, .menu button {
      color: #f3eee6; text-decoration: none; display: block; width: 100%;
      text-align: left; background: transparent; border: 0;
      border-top: 1px solid rgba(243,238,230,.16);
      padding: 10px 0; font: inherit; cursor: pointer;
    }
    .menu small { display: block; color: #b7b1a6; font-size: 14px; }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>
  <div class="stage">
    <a class="mark" href="https://github.com/FREECANDY-DEV">FREECANDY</a>
    <img class="reaper" src="assets/reaper.jpg?v=7" alt="Pixel reaper" />
    <button class="ghost g-svc" type="button" data-panel="svc" aria-label="Services"></button>
    <button class="ghost g-arc" type="button" data-panel="arc" aria-label="Archive"></button>
    <button class="ghost g-talk" type="button" data-panel="talk" aria-label="Contact"></button>
    <button class="ghost g-pay" type="button" data-panel="pay" aria-label="Deposit"></button>
    <section class="menu" id="svc" hidden>
      <h2>Services</h2>
      <ul>
        <li>Bots<small>from $99</small></li>
        <li>Pages<small>from $79</small></li>
        <li>Flows<small>from $149</small></li>
      </ul>
    </section>
    <section class="menu" id="arc" hidden>
      <h2>Archive</h2>
      <a href="https://github.com/FREECANDY-DEV/pixel-world">pixel-world</a>
      <a href="https://github.com/FREECANDY-DEV/Deus">Deus</a>
      <a href="https://github.com/FREECANDY-DEV/Pro_Linux_Screen_control">Screen control</a>
      <a href="https://github.com/FREECANDY-DEV/TryHackMe-writeups">Writeups</a>
    </section>
    <section class="menu" id="talk" hidden>
      <h2>Contact</h2>
      <p>Message on Telegram.</p>
      <a href="https://t.me/WIND0WSUPDATE">@WIND0WSUPDATE</a>
    </section>
    <section class="menu" id="pay" hidden>
      <h2>Deposit</h2>
      <p>Tap to copy. XRP needs the memo.</p>
      <button type="button" data-copy="TSTtvBTt8qrDE5fFoAp3DzqW58H8dfYwhV" data-label="USDT TRC20">USDT TRC20</button>
      <button type="button" data-copy="rBuZfn1m4tA6znziHsRp9AyC1M3qg6rgbF" data-label="XRP address">XRP address</button>
      <button type="button" data-copy="6421912" data-label="XRP memo 6421912">XRP memo 6421912</button>
    </section>
  </div>
  <script>
    const canvas = document.getElementById("stars");
    const ctx = canvas.getContext("2d");
    let stars = [];
    function makeStars() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvas.width = w;
      canvas.height = h;
      const n = Math.max(180, Math.min(340, Math.floor(w * h / 4500)));
      stars = Array.from({length: n}, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() < 0.12 ? Math.random() * 1.4 + 1.1 : Math.random() * 0.9 + 0.45,
        a: Math.random() * 0.45 + 0.45,
        s: Math.random() * 0.35 + 0.08,
        p: Math.random() * Math.PI * 2
      }));
    }
    function draw(t) {
      const w = canvas.width, h = canvas.height;
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, w, h);
      for (const star of stars) {
        star.y -= star.s;
        if (star.y < -3) { star.y = h + 3; star.x = Math.random() * w; }
        const tw = 0.5 + Math.sin(t * 0.003 + star.p) * 0.5;
        ctx.fillStyle = "rgba(255,248,232," + (star.a * tw) + ")";
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    makeStars();
    window.addEventListener("resize", makeStars);
    requestAnimationFrame(draw);
    const panels = [...document.querySelectorAll(".menu")];
    function closeAll() { panels.forEach((p) => { p.hidden = true; }); }
    document.querySelectorAll(".ghost").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const panel = document.getElementById(btn.dataset.panel);
        const willOpen = panel.hidden;
        closeAll();
        panel.hidden = !willOpen;
      });
    });
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".menu")) closeAll();
    });
    document.querySelectorAll("[data-copy]").forEach((btn) => {
      btn.addEventListener("click", async (e) => {
        e.stopPropagation();
        const label = btn.dataset.label;
        try { await navigator.clipboard.writeText(btn.dataset.copy); btn.textContent = "Copied"; }
        catch (err) { btn.textContent = btn.dataset.copy; }
        setTimeout(() => { btn.textContent = label; }, 900);
      });
    });
  </script>
</body>
</html>
