<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FREECANDY Demo — FAQ Chatbot</title>
  <link rel="stylesheet" href="../styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    .chat-shell {
      background: var(--bg-card);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      min-height: 420px;
      max-height: 70vh;
      clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    }
    .chat-head {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(0, 255, 168, 0.04);
    }
    .chat-dot {
      width: 10px; height: 10px;
      background: var(--neon);
      box-shadow: 0 0 12px var(--neon);
    }
    .chat-head strong { display: block; font-family: var(--display); font-size: 0.9rem; letter-spacing: 0.06em; }
    .chat-head span { color: var(--muted); font-size: 0.82rem; }
    .chat-log {
      flex: 1; overflow-y: auto; padding: 1rem;
      display: flex; flex-direction: column; gap: 0.65rem;
    }
    .bubble {
      max-width: 88%;
      padding: 0.7rem 0.9rem;
      font-size: 0.95rem;
      line-height: 1.45;
      border: 1px solid var(--border);
    }
    .bubble.bot { align-self: flex-start; background: #07090f; }
    .bubble.user {
      align-self: flex-end;
      background: var(--neon-dim);
      border-color: rgba(0, 255, 168, 0.3);
    }
    .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 0 1rem 0.75rem; }
    .chip {
      border: 1px solid var(--border-strong);
      background: transparent;
      color: var(--muted);
      padding: 0.4rem 0.7rem;
      min-height: 40px;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .chip:hover { color: var(--neon); border-color: var(--neon); }
    .chat-form {
      display: flex; gap: 0.5rem; padding: 0.85rem;
      border-top: 1px solid var(--border);
    }
    .chat-form input {
      flex: 1; min-height: 44px;
      border: 1px solid var(--border-strong);
      background: #07090f; color: var(--text);
      padding: 0.65rem 0.9rem; font: inherit;
    }
    .chat-form button {
      min-height: 44px; border: none;
      background: var(--neon); color: var(--ink);
      font-weight: 700; padding: 0 1.1rem; cursor: pointer; font: inherit;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
    }
  </style>
</head>
<body>
  <div class="fx-scanlines" aria-hidden="true"></div>
  <div class="fx-noise" aria-hidden="true"></div>
  <div class="demo-page">
    <a class="demo-back" href="../index.html">← Back to FREECANDY</a>
    <p class="section-tag mono">// DEMO · BOT</p>
    <h1 style="font-family:var(--display);letter-spacing:0.04em;margin:0.2rem 0 0.5rem">FAQ chatbot</h1>
    <p style="color:var(--muted);margin-top:0">Vanilla JS sample — ask about pricing, crypto, turnaround, or packages.</p>

    <div class="chat-shell" id="chat">
      <div class="chat-head">
        <span class="chat-dot" aria-hidden="true"></span>
        <div>
          <strong>FREECANDY BOT</strong>
          <span>Online · demo only</span>
        </div>
      </div>
      <div class="chat-log" id="log" aria-live="polite"></div>
      <div class="chips" id="chips"></div>
      <form class="chat-form" id="form">
        <input id="input" type="text" placeholder="Ask a question…" autocomplete="off" maxlength="240" />
        <button type="submit">Send</button>
      </form>
    </div>
  </div>

  <script>
    (function () {
      const FAQ = [
        { keys: ["price", "cost", "how much", "pricing", "package"], answer: "Packages start at Landing $79, Bots $99, Automations $149, AI agents $199. Pay with USDT (TRC20) or XRP (memo 6421912 required)." },
        { keys: ["crypto", "usdt", "xrp", "pay", "payment", "wallet"], answer: "FREECANDY accepts USDT TRC20 and XRP. For XRP you MUST include destination tag 6421912 or funds may be lost." },
        { keys: ["time", "turnaround", "fast", "delivery", "how long"], answer: "Typical turnaround is 48–96 hours after payment + clear brief." },
        { keys: ["anonymous", "name", "who", "identity"], answer: "FREECANDY is an anonymous AI freelancer brand — no real names, no calls, crypto handoff." },
        { keys: ["telegram", "contact", "email", "whatsapp"], answer: "Order via the storefront form or email freecandy.dev@gmail.com." },
        { keys: ["bot", "chatbot", "faq", "discord"], answer: "Bot packages cover WhatsApp/Telegram/Discord FAQ & support bots — like this demo, customized to your content." },
        { keys: ["landing", "website", "page"], answer: "Landing pages are static, mobile-first, and GitHub Pages ready — from $79." },
        { keys: ["automation", "gmail", "sheets", "workflow", "n8n"], answer: "Automation packages cover Gmail → Sheets, n8n/Make flows, and lead systems — from $119–$149." },
        { keys: ["hello", "hi", "hey"], answer: "Hey — FREECANDY FAQ demo online. Ask about packages, crypto, or delivery speed." },
        { keys: ["help"], answer: "Try: pricing, crypto payment, turnaround, bots, landings, or automations." }
      ];
      const SUGGEST = ["Pricing?", "Crypto payment", "Turnaround", "Bot package"];
      const log = document.getElementById("log");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const chips = document.getElementById("chips");

      function add(role, text) {
        const b = document.createElement("div");
        b.className = "bubble " + role;
        b.textContent = text;
        log.appendChild(b);
        log.scrollTop = log.scrollHeight;
      }
      function reply(q) {
        const lower = q.toLowerCase();
        for (let i = 0; i < FAQ.length; i++) {
          if (FAQ[i].keys.some(function (k) { return lower.indexOf(k) !== -1; })) return FAQ[i].answer;
        }
        return "Not sure yet — try pricing, USDT/XRP, turnaround, or order from the main storefront.";
      }
      SUGGEST.forEach(function (label) {
        const c = document.createElement("button");
        c.type = "button";
        c.className = "chip";
        c.textContent = label;
        c.addEventListener("click", function () {
          add("user", label);
          setTimeout(function () { add("bot", reply(label)); }, 280);
        });
        chips.appendChild(c);
      });
      add("bot", "Hi — FREECANDY FAQ demo. Ask about bots, landings, automations, or crypto payment.");
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        const q = input.value.trim();
        if (!q) return;
        add("user", q);
        input.value = "";
        setTimeout(function () { add("bot", reply(q)); }, 320);
      });
    })();
  </script>
</body>
</html>
